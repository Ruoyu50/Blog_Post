    <p>今天发生了一件让我感到比较后悔的事，但是希望自己能够坦然面对，我配的一副保持器弄丢了，对我打击比较大的原因是才配了一周多时间，原本预期不会这么快就搞丢或者弄坏，但是这么快就发生了
很可能是因为昨天晚上睡觉没有戴，然后早上吃了早饭才发现，就重新戴上了，下午出去吃饭，路过一家冰淇凌店，自己吃冰淇凌没有把保持器放在口袋因为害怕被压坏，所以放在了边上，后来旁边又来了一个黑人抽烟，我为了避开味道就仓促地离开了，于是保持器也忘得一干二净</p>
